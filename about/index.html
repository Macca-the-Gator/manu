  <style>
    *{box-sizing:border-box}
    html{background:#242923}
    body{margin:0;overflow-x:hidden}
    .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .anatomy-scroll{height:500vh;position:relative;background:#242923}
    .anatomy-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 65% 56% at 50% 46%,#343b32 0%,#242923 76%)}
    .anatomy-stage:before{content:"";position:absolute;inset:0;background:url("./plate-thorax.webp") center 38%/cover no-repeat;opacity:.16;filter:grayscale(.4) brightness(.65);pointer-events:none}
    .anatomy-stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,24,20,.13),transparent 30%,transparent 70%,rgba(20,24,20,.13));pointer-events:none}
    .anatomy-canvas{position:absolute;inset:0}
    .anatomy-canvas canvas{display:block;width:100%;height:100%}
    @media(max-width:700px){.anatomy-scroll{height:460vh}.anatomy-stage:before{background-size:auto 100%;opacity:.13}}
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">About Manu</h1>
    <section class="anatomy-scroll" aria-label="Anatomical body opening layer by layer as you scroll">
      <div class="anatomy-stage"><div class="anatomy-canvas" id="anatomy-canvas" aria-hidden="true"></div></div>
    </section>
  </main>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './vendor/GLTFLoader.js';
    import { MeshoptDecoder } from './vendor/meshopt_decoder.module.js';

    const section = document.querySelector('.anatomy-scroll');
    const host = document.querySelector('#anatomy-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.4;
    renderer.setClearColor(0, 0);
    host.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.32));
    scene.add(new THREE.HemisphereLight(0xfff5e6, 0x393631, 0.5));
    for (const [color, intensity, position] of [
      [0xfff7e2, 2.6, [6, 9, 9]],
      [0xdde5df, 0.7, [-6, 2, 7]],
      [0xffcbb8, 1.7, [-5, 5, -8]]
    ]) {
      const light = new THREE.DirectionalLight(color, intensity);
      light.position.set(...position);
      scene.add(light);
    }

    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    const layers = {};
    const layerMaterials = {};
    const muscleColors = {
      Tendon: ['#c4b596', 0.62, 1],
      Ligament: ['#bdad8b', 0.66, 1],
      Cartilage: ['#b9c4c0', 0.38, 1],
      Fascia: ['#b2a687', 0.72, 0.3],
      Bursa: ['#a3b3b0', 0.36, 0.26],
      'Articular capsule': ['#ac9f88', 0.62, 0.34]
    };
    const shellMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.FrontSide,
      uniforms: { opacity: { value: 0.72 } },
      vertexShader: `varying vec3 normalWorld; varying vec3 viewWorld;
        void main(){vec4 world=modelMatrix*vec4(position,1.0);normalWorld=normalize(mat3(modelMatrix)*normal);
        viewWorld=normalize(cameraPosition-world.xyz);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader: `uniform float opacity; varying vec3 normalWorld; varying vec3 viewWorld;
        void main(){float edge=pow(1.0-abs(dot(normalize(normalWorld),normalize(viewWorld))),2.4);
        vec3 tint=vec3(0.54,0.65,0.73)+edge*0.35;
        gl_FragColor=vec4(tint,(0.1+edge*0.9)*opacity);}`
    });

    const cameraPoints = [
      [0, 0.2, 17.6], [3.4, 1.6, 8], [-4.6, 1.9, 8.6], [3, 2, 6.4], [0.78, 2.3, 3.05]
    ];
    const targetPoints = [
      [0, -0.2, 0], [0, 1.4, 0], [0, 1.6, 0], [0, 1.9, 0], [0.13, 2.14, 0.06]
    ];
    const clamp = (value) => Math.max(0, Math.min(1, value));
    const smooth = (value, start, end) => {
      const x = clamp((value - start) / (end - start));
      return x * x * (3 - 2 * x);
    };
    const band = (value, a, b, c, d) => smooth(value, a, b) * (1 - smooth(value, c, d));
    let scrollTarget = 0;
    let scrollCurrent = 0;
    let ready = false;

    function resize() {
      const { width, height } = host.getBoundingClientRect();
      if (!width || !height) return;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function onScroll() {
      const top = section.getBoundingClientRect().top;
      const length = Math.max(1, section.offsetHeight - window.innerHeight);
      scrollTarget = clamp(-top / length);
    }

    function styleLayer(root, kind) {
      const materials = [];
      let piece = 0;
      root.traverse((mesh) => {
        if (!mesh.isMesh) return;
        mesh.frustumCulled = false;
        if (kind === 'skin') {
          mesh.material = shellMaterial;
          mesh.renderOrder = 4;
          return;
        }
        const source = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
        const material = source.clone();
        if (kind === 'muscle') {
          const style = muscleColors[source.name] || ['#8f2f28', 0.44, 1];
          material.color.set(style[0]);
          if (!muscleColors[source.name]) material.color.offsetHSL(0, 0, ((piece * 47) % 13 - 6) * 0.004);
          material.roughness = style[1];
          material.userData.baseOpacity = style[2];
          material.side = style[2] < 1 ? THREE.DoubleSide : THREE.FrontSide;
          material.emissive.copy(material.color);
          material.emissiveIntensity = muscleColors[source.name] ? 0 : 0.04;
        } else if (kind === 'skeleton') {
          material.color.set('#a08a5f');
          material.roughness = Math.max(material.roughness || 0, 0.55);
          material.emissive.copy(material.color);
          material.emissiveIntensity = 0.08;
        } else if (kind === 'vessels') {
          material.roughness = Math.max(material.roughness || 0, 0.55);
          material.emissive.copy(material.color);
          material.emissiveIntensity = 0.16;
        } else if (kind === 'heart') {
          material.roughness = Math.max(material.roughness || 0, 0.5);
          material.emissive.set('#ee7c6a');
          material.emissiveIntensity = 0.05;
        }
        material.metalness = 0;
        material.transmission = 0;
        material.anisotropy = 0;
        material.userData.baseOpacity ??= 1;
        mesh.material = material;
        materials.push(material);
        piece++;
      });
      layerMaterials[kind] = materials;
    }

    function setOpacity(kind, amount) {
      const root = layers[kind];
      if (!root) return;
      root.visible = amount > 0.01;
      for (const material of layerMaterials[kind]) {
        const opacity = amount * material.userData.baseOpacity;
        material.opacity = opacity;
        material.transparent = opacity < 0.995;
        material.depthWrite = opacity >= 0.995;
      }
    }

    function path(points, progress) {
      const step = clamp(progress) * (points.length - 1);
      const index = Math.min(Math.floor(step), points.length - 2);
      const eased = smooth(step - index, 0, 1);
      return new THREE.Vector3(...points[index]).lerp(new THREE.Vector3(...points[index + 1]), eased);
    }

    function frame() {
      requestAnimationFrame(frame);
      if (!ready) return;
      scrollCurrent += (scrollTarget - scrollCurrent) * 0.12;
      const p = scrollCurrent;
      const shellOpacity = 0.72 * (1 - smooth(p, 0.12, 0.26));
      shellMaterial.uniforms.opacity.value = shellOpacity;
      layers.skin.visible = shellOpacity > 0.01;
      setOpacity('muscle', band(p, 0.18, 0.28, 0.34, 0.42));
      const residualBone = 0.36 * smooth(p, 0.56, 0.66) * (1 - 0.62 * smooth(p, 0.8, 0.94));
      setOpacity('skeleton', Math.max(band(p, 0.32, 0.42, 0.56, 0.66), residualBone));
      setOpacity('vessels', smooth(p, 0.5, 0.62) * (1 - 0.6 * smooth(p, 0.8, 0.94)));
      setOpacity('heart', smooth(p, 0.72, 0.8));
      const cameraProgress = clamp((p - 0.1) / 0.8);
      const target = path(targetPoints, cameraProgress);
      const position = path(cameraPoints, cameraProgress);
      if (camera.aspect < 0.8) position.sub(target).multiplyScalar(1.15).add(target);
      camera.position.copy(position);
      camera.lookAt(target);
      renderer.render(scene, camera);
    }

    async function loadModels() {
      const files = ['skin-shell', 'muscles', 'skeleton', 'vessels', 'heart'];
      const results = await Promise.all(files.map((kind) => loader.loadAsync(`./models/${kind}.glb`)));
      const skin = results[0].scene;
      skin.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(skin);
      const size = bounds.getSize(new THREE.Vector3());
      const scale = 10 / size.y;
      const offset = new THREE.Vector3(
        -(bounds.min.x + size.x / 2) * scale,
        -5.3 - bounds.min.y * scale,
        -(bounds.min.z + size.z / 2) * scale
      );
      for (let index = 0; index < 4; index++) {
        const kind = files[index];
        const root = results[index].scene;
        if (kind === 'vessels') {
          const vesselScale = 10 / 1719.5;
          root.scale.setScalar(vesselScale);
          root.position.set(-(-334.1 + 666.9 / 2) * vesselScale, 78.1 * vesselScale - 5.3, -(-45.2 + 292 / 2) * vesselScale);
        } else {
          root.scale.setScalar(scale);
          root.position.copy(offset);
        }
        const layerName = kind === 'skin-shell' ? 'skin' : kind === 'muscles' ? 'muscle' : kind;
        styleLayer(root, layerName);
        layers[layerName] = root;
        scene.add(root);
      }
      const heart = results[4].scene;
      const heartBounds = new THREE.Box3().setFromObject(heart);
      const heartSize = heartBounds.getSize(new THREE.Vector3());
      const heartCenter = heartBounds.getCenter(new THREE.Vector3());
      const heartScale = (231.8 * 10 / 1719.5) / Math.max(heartSize.x, heartSize.y, heartSize.z);
      heart.scale.setScalar(heartScale);
      heart.position.set(-heartCenter.x * heartScale + 0.137, -heartCenter.y * heartScale + 2.154, -heartCenter.z * heartScale + 0.09);
      styleLayer(heart, 'heart');
      layers.heart = heart;
      scene.add(heart);
      ready = true;
      host.dataset.ready = 'true';
    }

    resize();
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', resize, { passive: true });
    new ResizeObserver(resize).observe(host);
    frame();
    loadModels().catch((error) => console.error('Anatomy models could not be loaded.', error));
  </script>
</body>
</html>
