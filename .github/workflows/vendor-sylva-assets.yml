# One-time asset vendoring for the standalone Sylva page
name: Vendor Sylva assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vendor-sylva-assets.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download runtime assets locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inner-green-assets licenses

          curl -fL --retry 3 --retry-delay 2             "https://unpkg.com/three@0.149.0/build/three.min.js"             -o inner-green-assets/three.min.js

          curl -fL --retry 3 --retry-delay 2             "https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/1ec8f6ee2750554b4bc59ff0b507d316a82a7ba37e0e5bebc41d3bd9b9faad46.woff2"             -o inner-green-assets/lexend-latin.woff2

          curl -fL --retry 3 --retry-delay 2             "https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/c74a626e396794aa239bca6f/card-ethos.jpg"             -o inner-green-assets/card-ethos.jpg

          curl -fL --retry 3 --retry-delay 2             "https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/c74a626e396794aa239bca6f/card-ecostove.jpg"             -o inner-green-assets/card-ecostove.jpg

          curl -fL --retry 3 --retry-delay 2             "https://raw.githubusercontent.com/mrdoob/three.js/r149/LICENSE"             -o licenses/THREE-LICENSE.txt

          curl -fL --retry 3 --retry-delay 2             "https://raw.githubusercontent.com/google/fonts/main/ofl/lexend/OFL.txt"             -o licenses/LEXEND-OFL.txt

      - name: Point the page to local assets
        shell: python
        run: |
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          replacements = {
              "https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/1ec8f6ee2750554b4bc59ff0b507d316a82a7ba37e0e5bebc41d3bd9b9faad46.woff2":
                  "inner-green-assets/lexend-latin.woff2",
              "https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/c74a626e396794aa239bca6f/card-ethos.jpg":
                  "inner-green-assets/card-ethos.jpg",
              "https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/c74a626e396794aa239bca6f/card-ecostove.jpg":
                  "inner-green-assets/card-ecostove.jpg",
          }

          for remote, local in replacements.items():
              s = s.replace(remote, local)

          p.write_text(s, encoding="utf-8")

      - name: Verify local package
        shell: bash
        run: |
          set -euo pipefail
          test -s inner-green-assets/three.min.js
          test -s inner-green-assets/lexend-latin.woff2
          test -s inner-green-assets/card-ethos.jpg
          test -s inner-green-assets/card-ecostove.jpg
          test -s licenses/THREE-LICENSE.txt
          test -s licenses/LEXEND-OFL.txt

          grep -q 'inner-green-assets/three.min.js' index.html
          grep -q 'inner-green-assets/lexend-latin.woff2' index.html
          grep -q 'inner-green-assets/card-ethos.jpg' index.html
          grep -q 'inner-green-assets/card-ecostove.jpg' index.html

          if grep -q 'ublctyddhtbgaersvxxb.supabase.co' index.html; then
            echo "A remote ThreeUI asset reference is still present in index.html"
            exit 1
          fi

      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inner-green-assets licenses
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Vendor Sylva runtime assets locally"
          git push
